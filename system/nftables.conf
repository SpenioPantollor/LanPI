#!/usr/sbin/nft -f

# LanPi's firewall ruleset -- see ARCHITECTURE.MD Rule 7. Installed to
# /etc/nftables.conf by system/install.sh (idempotent, safe to
# re-run); nftables.service loads it at boot.
#
# The only rule here: block LanPi's own management interface (port
# 8000) from eth0, the TEST PORT. A device plugged into eth0 for
# diagnostics has no legitimate reason to reach LanPi's own web UI/API
# through the port under test -- it should only be able to be probed
# by, not act as, the management surface.
#
# SSH (22) is deliberately left reachable on eth0, not blocked
# alongside 8000: it's the documented recovery path if wlan0 becomes
# unreachable (see STATUS.md's wlan0-recovery-via-eth0 procedure), and
# closing it too would risk locking the maintainer out with no way
# back in except physical access to the SD card. Every other
# port/protocol on eth0, and everything on wlan0, is left untouched by
# this ruleset (policy accept on every chain) -- this is a narrow,
# single-purpose rule, not a general firewall.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority filter; policy accept;

		iifname "eth0" tcp dport 8000 drop
	}
	chain forward {
		type filter hook forward priority filter; policy accept;
	}
	chain output {
		type filter hook output priority filter; policy accept;
	}
}
