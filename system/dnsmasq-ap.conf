# LanPi fallback AP: DHCP only, scoped to wlan0. Deployed to
# /etc/dnsmasq.conf, and this dnsmasq instance is only ever started
# while the fallback AP is up (see lanpi-ap-up.sh) -- never enabled at
# boot.
#
# No DNS hijack here (removed -- maintainer's call, 2026-08-22): it
# caused more problems than it solved (breaks real DNS lookups for
# anyone using the fallback AP for something other than reaching
# LanPi, and the captive-portal auto-popup it was for never reliably
# worked on iOS anyway, see STATUS.md). Clients reach the dashboard at
# the AP's fixed address, 172.24.58.1:8000, directly.
interface=wlan0
bind-interfaces
except-interface=lo
dhcp-range=172.24.58.10,172.24.58.100,255.255.255.0,12h
dhcp-option=3,172.24.58.1
dhcp-option=6,172.24.58.1
