# LanPi fallback AP: DHCP + captive-portal DNS hijack, scoped to wlan0
# only. Every hostname resolves to the AP's own address so any HTTP
# request a client makes lands on LanPi's dashboard, the way public
# Wi-Fi captive portals work. Deployed to /etc/dnsmasq.conf, and this
# dnsmasq instance is only ever started while the fallback AP is up
# (see lanpi-ap-up.sh) -- never enabled at boot.
interface=wlan0
bind-interfaces
except-interface=lo
dhcp-range=172.24.58.10,172.24.58.100,255.255.255.0,12h
dhcp-option=3,172.24.58.1
dhcp-option=6,172.24.58.1
address=/#/172.24.58.1
